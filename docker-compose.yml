version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bizgst_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     bizgst_user
      POSTGRES_PASSWORD: bizgst_pass
      POSTGRES_DB:       bizgst_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizgst_user -d bizgst_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (optional — for caching GST summaries) ─────────────
  redis:
    image: redis:7-alpine
    container_name: bizgst_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  # ── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizgst_backend
    restart: unless-stopped
    environment:
      NODE_ENV:      development
      PORT:          5000
      DATABASE_URL:  postgresql://bizgst_user:bizgst_pass@postgres:5432/bizgst_db
      JWT_SECRET:    change_this_to_a_long_random_secret_in_production
      JWT_EXPIRES_IN: 7d
      MOCK_OTP:      "true"
      FIXED_DEV_OTP: "123456"
      FRONTEND_URL:  http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bizgst_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true

volumes:
  postgres_data:
