<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BizGST — Smart GST Accounting for Indian Businesses" />
    <title>BizGST</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #F7F6F2;
        color: #1A1A18;
        -webkit-font-smoothing: antialiased;
      }
      /* Scrollbars */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #E2DFD5; border-radius: 4px; }
      /* Focus */
      input:focus, select:focus, textarea:focus, button:focus-visible {
        outline: 2px solid #2D7D46;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
